<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shivwik Holistic Care — Clinic Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root {
    --bg: #0b0f1a;
    --surface: #111827;
    --card: #1a2236;
    --card-hover: #1e2a40;
    --border: #1f2d45;
    --accent: #14b8a6;
    --accent-light: #2dd4bf;
    --accent-glow: rgba(20,184,166,0.15);
    --green: #10b981;
    --green-bg: rgba(16,185,129,0.12);
    --yellow: #f59e0b;
    --yellow-bg: rgba(245,158,11,0.12);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --purple: #8b5cf6;
    --purple-bg: rgba(139,92,246,0.12);
    --text: #f1f5f9;
    --text-muted: #64748b;
    --text-soft: #94a3b8;
    --sidebar-w: 250px;
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; overflow:hidden;
  }
  a { color:inherit; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  /* ---------- LOGIN ---------- */
  #loginScreen {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 20%, rgba(20,184,166,0.12), transparent 45%), var(--bg);
    z-index:500;
  }
  .login-card {
    width:380px; max-width:92vw; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:36px 32px;
  }
  .login-logo { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .login-logo .logo-icon { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--purple)); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .login-logo .logo-text { font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; }
  .login-logo .logo-sub { font-size:11px; color:var(--text-muted); }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12px; color:var(--text-soft); margin-bottom:6px; font-weight:600; }
  .field input, .field select, .field textarea {
    width:100%; background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:13.5px; font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--accent); }
  .btn { padding:10px 18px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.15s; }
  .btn-primary { background:var(--accent); color:#04231f; width:100%; justify-content:center; }
  .btn-primary:hover { background:var(--accent-light); }
  .btn-secondary { background:var(--card); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover { background:var(--card-hover); }
  .btn-danger { background:var(--red-bg); color:var(--red); }
  .btn-danger:hover { background:rgba(239,68,68,0.22); }
  .btn-sm { padding:6px 12px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  #loginError { color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }

  /* ---------- APP SHELL ---------- */
  #app { display:none; width:100%; }
  .sidebar {
    width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; height:100dvh; position:fixed; left:0; top:0; z-index:100;
    transition:width .18s ease, transform .2s ease;
  }
  .sidebar-logo { padding:22px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .sidebar-logo .logo-icon { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--purple)); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .sidebar-logo .logo-text { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; line-height:1.2; }
  .sidebar-logo .logo-sub { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
  .sidebar-nav { flex:1; overflow-y:auto; padding:14px 10px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500; color:var(--text-soft); margin-bottom:2px; }
  .nav-item:hover { background:var(--card); color:var(--text); }
  .nav-item.active { background:var(--accent-glow); color:var(--accent-light); }
  .nav-icon { width:16px; text-align:center; }
  .nav-badge { margin-left:auto; background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:20px; }
  .sidebar-footer { padding:14px 12px; border-top:1px solid var(--border); }
  .user-info { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
  .user-name { font-size:12.5px; font-weight:600; }
  .user-role { font-size:10.5px; color:var(--text-muted); text-transform:capitalize; }
  .signout-btn { width:100%; margin-top:10px; }

  .main { margin-left:var(--sidebar-w); flex:1; height:100vh; height:100dvh; overflow-y:auto; transition:margin-left .18s ease; }
  .topbar { position:sticky; top:0; z-index:50; background:rgba(11,15,26,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; gap:16px; }
  .icon-btn { background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:8px; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; flex-shrink:0; }
  .icon-btn:hover { background:var(--card-hover); }
  .topbar-signout { display:none; }
  .sidebar-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:90; }

  /* Collapsed sidebar (desktop): icon rail */
  body.nav-collapsed { --sidebar-w: 68px; }
  body.nav-collapsed .sidebar-logo { justify-content:center; padding:22px 8px; }
  body.nav-collapsed .sidebar-logo .logo-words,
  body.nav-collapsed .nav-label,
  body.nav-collapsed .user-text,
  body.nav-collapsed .btn-label,
  body.nav-collapsed .nav-badge { display:none; }
  body.nav-collapsed .nav-item { justify-content:center; padding:11px 0; }
  body.nav-collapsed .user-info { justify-content:center; padding:8px 0; }
  body.nav-collapsed .signout-btn { justify-content:center; padding:9px 0; }
  body.nav-collapsed .nav-icon { font-size:17px; width:auto; }
  .topbar-title { font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; flex:1; }
  .topbar-sub { font-size:12px; color:var(--text-muted); }
  .content { padding:24px 28px 60px; }

  .grid { display:grid; gap:16px; }
  .grid-4 { grid-template-columns:repeat(4,1fr); }
  .grid-3 { grid-template-columns:repeat(3,1fr); }
  .grid-2 { grid-template-columns:repeat(2,1fr); }
  @media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }

  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .stat-card .stat-label { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .stat-card .stat-value { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; }
  .stat-card .stat-value.green { color:var(--green); }
  .stat-card .stat-value.red { color:var(--red); }
  .stat-card .stat-value.yellow { color:var(--yellow); }

  .panel { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:20px; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  .panel-title { font-size:15px; font-weight:600; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--text-muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover td { background:var(--card-hover); }

  .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.green { background:var(--green-bg); color:var(--green); }
  .badge.red { background:var(--red-bg); color:var(--red); }
  .badge.yellow { background:var(--yellow-bg); color:var(--yellow); }
  .badge.purple { background:var(--purple-bg); color:var(--purple); }
  .badge.grey { background:rgba(148,163,184,0.15); color:var(--text-soft); }

  .search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; width:240px; }
  .search-box input { background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; }

  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab { padding:9px 14px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active { color:var(--accent-light); border-color:var(--accent-light); }

  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-start; justify-content:center; z-index:400; overflow-y:auto; padding:40px 16px; }
  .modal { width:560px; max-width:100%; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:26px; }
  .modal h3 { font-family:'Space Grotesk',sans-serif; font-size:17px; margin-bottom:18px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  #toastRoot { position:fixed; bottom:20px; right:20px; z-index:600; display:flex; flex-direction:column; gap:10px; }
  .toast { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); padding:12px 16px; border-radius:8px; font-size:13px; min-width:240px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .toast.error { border-left-color:var(--red); }
  .toast.success { border-left-color:var(--green); }

  .muted { color:var(--text-muted); }
  .empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:13px; }
  .hidden { display:none !important; }
  .stars { color:var(--yellow); letter-spacing:1px; }
  .modal.wide { width:880px; }
  /* ---------- TABLET / MOBILE ---------- */
  @media (max-width:900px) {
    body.nav-collapsed { --sidebar-w: 250px; }           /* rail mode is desktop-only */
    body.nav-collapsed .nav-label, body.nav-collapsed .user-text, body.nav-collapsed .btn-label,
    body.nav-collapsed .sidebar-logo .logo-words { display:revert; }
    body.nav-collapsed .nav-item { justify-content:flex-start; padding:9px 12px; }
    body.nav-collapsed .sidebar-logo { justify-content:flex-start; padding:22px 20px; }
    .sidebar { width:min(280px, 84vw); transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.5); }
    body.nav-open .sidebar { transform:translateX(0); }
    body.nav-open .sidebar-backdrop { display:block; }
    .main { margin-left:0; }
    .topbar { padding:12px 14px; gap:10px; }
    .topbar-title { font-size:17px; }
    .topbar-signout { display:inline-flex; }
    .content { padding:14px 12px 48px; }
    .panel { padding:14px; overflow-x:auto; }
    .panel table { min-width:620px; }
    .tabs { overflow-x:auto; white-space:nowrap; }
    .search-box { width:100%; }
    .modal-backdrop { padding:14px 10px; }
    .modal { padding:18px; }
    .article-preview { padding:16px; }
  }
  @media (max-width:600px) {
    .grid-4, .grid-3 { grid-template-columns:repeat(2,1fr); }
    .grid-2, .form-row { grid-template-columns:1fr; }
    .stat-card { padding:14px; }
    .stat-card .stat-value { font-size:22px; }
    .modal-actions { flex-wrap:wrap; }
    .modal-actions .btn { flex:1 1 auto; justify-content:center; }
  }

  .article-preview { background:#fff; color:#163331; border-radius:10px; padding:22px 26px; max-height:60vh; overflow-y:auto; font-size:14.5px; line-height:1.65; }
  .article-preview h1 { font-size:22px; margin-bottom:6px; }
  .article-preview h2 { font-size:17px; margin:18px 0 8px; }
  .article-preview p, .article-preview ul { margin-bottom:10px; }
  .article-preview ul { padding-left:20px; }
  .format-help { font-size:11.5px; color:var(--text-muted); margin-top:4px; }
  .flex { display:flex; align-items:center; }
  .gap-8 { gap:8px; } .gap-12 { gap:12px; }
  .mb-8 { margin-bottom:8px; } .mb-16 { margin-bottom:16px; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🏥</div>
      <div>
        <div class="logo-text">Shivwik Holistic Care</div>
        <div class="logo-sub">Clinic Dashboard</div>
      </div>
    </div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>

    </p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🏥</div>
      <div class="logo-words">
        <div class="logo-text">Shivwik Holistic</div>
        <div class="logo-sub">Care Dashboard</div>
      </div>
    </div>
    <div class="sidebar-nav" id="sidebarNav"></div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">?</div>
        <div class="user-text">
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
      </div>
      <button class="btn btn-secondary signout-btn" id="changePasswordBtn" style="margin-bottom:8px" title="Change Password">🔑<span class="btn-label"> Change Password</span></button>
      <button class="btn btn-secondary signout-btn" id="signOutBtn" title="Sign Out">⏻<span class="btn-label"> Sign Out</span></button>

  </div>
  <div class="main">

      <button class="icon-btn" id="navToggleBtn" title="Show / hide menu" aria-label="Show or hide menu" aria-controls="sidebar">☰</button>
      <div style="flex:1;min-width:0">
        <div class="topbar-title" id="pageTitle">Dashboard</div>
        <div class="topbar-sub" id="pageSub"></div>
      </div>
      <button class="icon-btn topbar-signout" id="topSignOutBtn" title="Sign Out" aria-label="Sign out">⏻</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ======================================================================
   CONFIG — edit these two lines before using this file on any computer.
   The anon/public key is safe to embed: it is meaningless without a staff
   login, because every table is protected by Row Level Security.
   Find it in Supabase → Settings → API → "anon" "public" key.
   ====================================================================== */
const SUPABASE_URL = "https://ycxuipirpyjadkavkcrf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kOEXCSZkqQMV0MJ8kaa1Gw_v_QaPTdm";
const EDGE_FUNCTION_URL = SUPABASE_URL + "/functions/v1/admin-manage-staff";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------------------------------------------------------------
   STATE
   --------------------------------------------------------------------- */
const state = {
  session: null,
  staff: null,   // { id, name, email, role, active }
  view: "home",
  viewParams: {},
};

const ROLE_LABELS = { admin: "Admin", doctor: "Doctor", reception: "Reception", billing: "Billing", marketing: "Marketing" };
const STAFF_ROLES = ["admin","doctor","reception","billing","marketing"];

const NAV_ITEMS = [
  { key: "home", label: "Dashboard", icon: "📊", roles: ["admin","doctor","reception","billing"] },
  { key: "patients", label: "Patients", icon: "🧑‍🤝‍🧑", roles: ["admin","doctor","reception","billing"] },
  { key: "appointments", label: "Appointments", icon: "📅", roles: ["admin","doctor","reception"] },
  { key: "clinical", label: "Clinical Records", icon: "🩺", roles: ["admin","doctor"] },
  { key: "doctors", label: "Doctors & Services", icon: "👨‍⚕️", roles: ["admin"] },
  { key: "billing", label: "Billing & Payments", icon: "💳", roles: ["admin","doctor","reception","billing"] },
  { key: "feedback", label: "Feedback & Escalations", icon: "⚠️", roles: ["admin","doctor"] },
  { key: "reports", label: "Reports", icon: "📄", roles: ["admin","doctor"] },
  { key: "closures", label: "Closures & Holidays", icon: "🗓️", roles: ["admin","doctor","reception"] },
  { key: "articles", label: "Website Articles", icon: "📝", roles: ["admin","doctor","marketing"] },
  { key: "staff", label: "Staff & Users", icon: "🔑", roles: ["admin"] },
  { key: "data", label: "Import / Export / Backup", icon: "🗂️", roles: ["admin"] },
];

/* ---------------------------------------------------------------------
   UTILITIES
   --------------------------------------------------------------------- */
function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d);
  if (isNaN(dt)) return "—";
  return dt.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
}
function fmtDateOnly(d) {
  if (!d) return "—";
  const dt = new Date(d);
  if (isNaN(dt)) return "—";
  return dt.toLocaleDateString("en-IN", { dateStyle: "medium" });
}
function todayIST() {
  // en-CA locale gives YYYY-MM-DD directly, in the clinic's timezone — NOT
  // new Date().toISOString() which is always UTC and can be a day behind
  // during the IST-midnight-to-5:30am window.
  return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
}
function fmtMoney(n) {
  if (n === null || n === undefined) return "₹0";
  return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
}
function toast(msg, type) {
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}
function can(...roles) { return state.staff && roles.includes(state.staff.role); }
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function toCSV(rows) {
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const esc = v => {
    if (v === null || v === undefined) return "";
    const s = typeof v === "object" ? JSON.stringify(v) : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c])).join(","))].join("\n");
}
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(v => v && v.trim())).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] ?? "").trim());
    return obj;
  });
}

/* ---------------------------------------------------------------------
   MODAL
   --------------------------------------------------------------------- */
function openModal(title, bodyHtml, opts) {
  opts = opts || {};
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal${opts.wide ? ' wide' : ''}">
        <h3>${escapeHtml(title)}</h3>
        <div id="modalBody">${bodyHtml}</div>
      </div>
    </div>`;
  document.getElementById("modalBackdrop").addEventListener("click", e => {

function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

async function loadStaffProfile(userId) {
  const { data, error } = await sb.from("staff").select("*").eq("id", userId).maybeSingle();
  if (error) throw error;
  return data;
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginBtn");
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    const profile = await loadStaffProfile(data.user.id);
    if (!profile) {
      await sb.auth.signOut();
      throw new Error("Your account has no staff profile yet. Ask your admin to add you in Staff & Users.");
    }
    if (!profile.active) {
      await sb.auth.signOut();
      throw new Error("Your account has been deactivated. Contact your clinic admin.");
    }
    state.session = data.session;
    state.staff = profile;
    storeSet(SIGNED_IN_AT_KEY, Date.now());
    markActivity(true);
    enterApp();
  } catch (err) {
    errEl.textContent = err.message || "Sign-in failed.";
  } finally {
    btn.disabled = false; btn.textContent = "Sign In";
  }
}

async function handleSignOut(reason) {
  stopIdleTimer();
  closeModal(); closeMobileNav();
  state.session = null; state.staff = null;
  storeDel(LAST_ACTIVE_KEY); storeDel(SIGNED_IN_AT_KEY);
  document.getElementById("app").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("loginError").textContent =
    reason === "idle" ? "You were signed out after 15 minutes of inactivity, to protect patient data." :
    reason === "max" ? "Your session ended after 12 hours. Please sign in again." : "";
  await sb.auth.signOut();
}

      <div class="field mb-8"><label>New Password * (min 8 characters)</label><input name="next" type="password" required minlength="8"></div>

/* ---------------------------------------------------------------------
   IDLE TIMEOUT — auto sign-out after inactivity (protects patient data
   on an unattended, already-logged-in front-desk/clinic computer).
   --------------------------------------------------------------------- */
const IDLE_TIMEOUT_MS = 15 * 60 * 1000;
const IDLE_WARNING_MS = 60 * 1000;
let idleTimer = null, idleCountdownInterval = null;

function clearIdleWarning() {
  clearInterval(idleCountdownInterval);
  idleCountdownInterval = null;
  const el = document.getElementById("idleWarningBackdrop");
  if (el) el.remove();
}

function startIdleTimer() {
  clearTimeout(idleTimer);
  clearIdleWarning();
  if (!state.session) return;
  const last = storeGet(LAST_ACTIVE_KEY) || Date.now();
  const remaining = IDLE_TIMEOUT_MS - (Date.now() - last);
  idleTimer = setTimeout(showIdleWarning, Math.max(0, remaining - IDLE_WARNING_MS));
}

function stopIdleTimer() {
  clearTimeout(idleTimer);
  clearIdleWarning();
}

function showIdleWarning() {
  let secondsLeft = Math.round(IDLE_WARNING_MS / 1000);
  const div = document.createElement("div");
  div.id = "idleWarningBackdrop";
  div.className = "modal-backdrop";
  div.innerHTML = `
    <div class="modal">
      <h3>Still there?</h3>
      <p style="color:var(--text-soft);font-size:13.5px;margin-bottom:18px">You'll be signed out in <b id="idleCountdown">${secondsLeft}</b> seconds due to inactivity, to protect patient data.</p>
      <div class="modal-actions"><button class="btn btn-primary" id="stayBtn">Stay Signed In</button></div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById("stayBtn").addEventListener("click", () => { markActivity(true); startIdleTimer(); });
  idleCountdownInterval = setInterval(() => {
    secondsLeft--;
    const el = document.getElementById("idleCountdown");
    if (el) el.textContent = secondsLeft;
    if (secondsLeft <= 0) {
      clearIdleWarning();
      handleSignOut("idle");
    }
  }, 1000);
}

/* The in-page timer above can't run while a phone browser is backgrounded or
   closed, and Supabase keeps the session in storage, so reopening the app
   would silently sign you back in. We therefore record the last activity and
   the sign-in time, and check them whenever the app is opened or brought back
   to the foreground. A session also ends 12 hours after sign-in, whatever
   the activity (one clinic shift). */
const MAX_SESSION_MS = 12 * 60 * 60 * 1000;
const LAST_ACTIVE_KEY = "shc_last_active";
const SIGNED_IN_AT_KEY = "shc_signed_in_at";
let lastActivityWrite = 0;

function storeGet(k) { try { return Number(localStorage.getItem(k)) || 0; } catch (e) { return 0; } }
function storeSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* storage blocked */ } }
function storeDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }

function markActivity(force) {
  const now = Date.now();
  if (force || now - lastActivityWrite > 15000) { storeSet(LAST_ACTIVE_KEY, now); lastActivityWrite = now; }
}
// Missing timestamps count as expired, so a session can never outlive the rules.
function sessionExpiredReason() {
  const now = Date.now();
  const last = storeGet(LAST_ACTIVE_KEY), since = storeGet(SIGNED_IN_AT_KEY);
  if (!last || now - last > IDLE_TIMEOUT_MS) return "idle";
  if (!since || now - since > MAX_SESSION_MS) return "max";
  return null;
}
function checkSessionOnResume() {
  if (!state.session) return;
  const reason = sessionExpiredReason();
  if (reason) handleSignOut(reason);
  else startIdleTimer();
}

["mousemove","mousedown","keydown","scroll","touchstart","click"].forEach(evt => {
  document.addEventListener(evt, () => { if (state.session) { markActivity(); startIdleTimer(); } }, { passive: true });
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkSessionOnResume(); });
window.addEventListener("pageshow", checkSessionOnResume);
window.addEventListener("focus", checkSessionOnResume);
// Signing out in one tab signs out every open tab.
sb.auth.onAuthStateChange(event => { if (event === "SIGNED_OUT" && state.session) handleSignOut(); });

/* ---------------------------------------------------------------------
   SIDEBAR: collapsible rail on desktop, slide-out drawer on tablet/phone
   --------------------------------------------------------------------- */
const NAV_COLLAPSED_KEY = "shc_nav_collapsed";
const isSmallScreen = () => window.matchMedia("(max-width:900px)").matches;
function closeMobileNav() { document.body.classList.remove("nav-open"); }
function toggleNav() {
  if (isSmallScreen()) { document.body.classList.toggle("nav-open"); return; }
  const collapsed = document.body.classList.toggle("nav-collapsed");
  try { localStorage.setItem(NAV_COLLAPSED_KEY, collapsed ? "1" : "0"); } catch (e) { /* storage blocked */ }
}
try { if (localStorage.getItem(NAV_COLLAPSED_KEY) === "1") document.body.classList.add("nav-collapsed"); } catch (e) { /* storage blocked */ }
document.getElementById("navToggleBtn").addEventListener("click", toggleNav);
document.getElementById("sidebarBackdrop").addEventListener("click", closeMobileNav);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMobileNav(); });

async function bootstrapSession() {
  const { data } = await sb.auth.getSession();
  if (data.session && sessionExpiredReason()) {
    const reason = sessionExpiredReason();
    await sb.auth.signOut();
    storeDel(LAST_ACTIVE_KEY); storeDel(SIGNED_IN_AT_KEY);
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("loginError").textContent = reason === "max"
      ? "Your session ended after 12 hours. Please sign in again."
      : "You were signed out after 15 minutes of inactivity, to protect patient data.";
    return;
  }
  if (data.session) {
    try {
      const profile = await loadStaffProfile(data.session.user.id);
      if (profile && profile.active) {
        state.session = data.session; state.staff = profile;
        enterApp();
        return;
      }
    } catch (e) { /* fall through to login */ }
  }
  document.getElementById("loginScreen").style.display = "flex";
}

    sb.from("appointments").select("id", { count: "exact", head: true })

      .in("status", ["confirmed","completed"]),

      <table><thead><tr><th>When</th><th>Patient</th><th>Doctor</th><th>Status</th></tr></thead>

function statusBadge(status) {
  const map = {
    confirmed: "green", completed: "green", cancelled: "red", declined: "red",
    missed: "red", pending_doctor_approval: "yellow", reschedule_pending: "yellow", pending_confirmation: "yellow",
  };
  return `<span class="badge ${map[status]||'grey'}">${escapeHtml((status||'').replace(/_/g,' '))}</span>`;
}

        <div class="field"><label>Name *</label><input name="name" required value="${escapeHtml(p.name||'')}"></div>

          <tbody>${(sessionNotes.data||[]).map(s=>`<tr>
            <td>${fmtDateOnly(s.session_date)}</td>
            <td>${escapeHtml(s.protocol?.protocol_name||'—')}</td>
            <td style="font-size:12px">${escapeHtml(s.notes||'')}</td>
            <td style="font-size:12px">${escapeHtml(s.exercises_prescribed||'')}</td>
            <td>${s.pain_score_before ?? '—'} → ${s.pain_score_after ?? '—'}</td>
          </tr>`).join("")||`<tr><td colspan="5" class="empty-state">No session notes yet — add one after a visit to track progress.</td></tr>`}</tbody></table>
        </div>`;
      document.getElementById("addHistBtn").addEventListener("click", () => {
        openModal("Add Medical History", `
          <form id="histForm">
            <div class="field mb-8"><label>Condition *</label><input name="condition" required></div>
            <div class="field mb-8"><label>Diagnosis Date</label><input name="diagnosis_date" type="date"></div>
            <div class="field mb-8"><label>Notes</label><textarea name="notes" rows="3"></textarea></div>
            <div class="modal-actions"><button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
          </form>`);
        document.getElementById("cancelBtn").addEventListener("click", closeModal);
        document.getElementById("histForm").addEventListener("submit", async e => {
          e.preventDefault();
          const payload = Object.fromEntries(new FormData(e.target).entries());
          payload.patient_id = id; payload.created_by = state.staff.id;
          const { error } = await sb.from("medical_history").insert(payload);
          if (error) return toast(error.message, "error");
          closeModal(); toast("Saved.", "success"); renderTab("Clinical");
        });
      });
      function openProtocolForm(proto) {
        const isEdit = !!proto;
        openModal(isEdit ? "Edit Treatment Protocol" : "Add Treatment Protocol", `
          <form id="protoForm">
            <div class="field mb-8"><label>Protocol Name *</label><input name="protocol_name" required value="${escapeHtml(proto?.protocol_name||'')}"></div>
            <div class="field mb-8"><label>Description</label><textarea name="description" rows="2">${escapeHtml(proto?.description||'')}</textarea></div>
            <div class="form-row mb-8">
              <div class="field"><label>Sessions Planned</label><input name="sessions_planned" type="number" min="1" value="${proto?.sessions_planned ?? ''}"></div>
              <div class="field"><label>Sessions Completed</label><input name="sessions_completed" type="number" min="0" value="${proto?.sessions_completed ?? 0}"></div>
            </div>
            <div class="form-row mb-8">
              <div class="field"><label>Start Date</label><input name="start_date" type="date" value="${proto?.start_date || todayIST()}"></div>
              <div class="field"><label>Status</label>
                <select name="status">${["active","completed","discontinued"].map(s=>`<option value="${s}" ${proto?.status===s?'selected':''}>${s}</option>`).join("")}</select>
              </div>
            </div>
            <div class="field mb-8"><label>Prognosis</label><textarea name="prognosis" rows="2" placeholder="Expected outcome / recovery trajectory">${escapeHtml(proto?.prognosis||'')}</textarea></div>
            <div class="modal-actions"><button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button><button type="submit" class="btn btn-primary">${isEdit?'Save Changes':'Save'}</button></div>
          </form>`);
        document.getElementById("cancelBtn").addEventListener("click", closeModal);
        document.getElementById("protoForm").addEventListener("submit", async e => {
          e.preventDefault();
          const payload = Object.fromEntries(new FormData(e.target).entries());
          if (payload.sessions_planned) payload.sessions_planned = Number(payload.sessions_planned); else delete payload.sessions_planned;
          payload.sessions_completed = Number(payload.sessions_completed || 0);
          if (!payload.prognosis) delete payload.prognosis;
          let error;
          if (isEdit) {
            payload.updated_at = new Date().toISOString();
            ({ error } = await sb.from("treatment_protocols").update(payload).eq("id", proto.id));
          } else {
            payload.patient_id = id; payload.created_by = state.staff.id;
            ({ error } = await sb.from("treatment_protocols").insert(payload));
          }
          if (error) return toast(error.message, "error");
          closeModal(); toast("Saved.", "success"); renderTab("Clinical");
        });
      }
      document.getElementById("addProtocolBtn").addEventListener("click", () => openProtocolForm(null));
      body.querySelectorAll("[data-edit-proto]").forEach(btn => btn.addEventListener("click", () => {
        const proto = (protocols.data||[]).find(p => String(p.id) === btn.dataset.editProto);
        openProtocolForm(proto);
      }));
      function openSessionNoteForm(preselectProtocolId) {
        const options = (protocols.data||[]).map(p=>`<option value="${p.id}" ${String(p.id)===String(preselectProtocolId)?'selected':''}>${escapeHtml(p.protocol_name)}</option>`).join("");
        openModal("Add Session Note", `
          <form id="sessionForm">
            <div class="field mb-8"><label>Protocol *</label><select name="treatment_protocol_id" required>${options}</select></div>
            <div class="field mb-8"><label>Session Date</label><input name="session_date" type="date" value="${todayIST()}"></div>
            <div class="field mb-8"><label>Notes / Progress</label><textarea name="notes" rows="3" placeholder="What was observed, how the patient is progressing..."></textarea></div>
            <div class="field mb-8"><label>Exercises Prescribed</label><textarea name="exercises_prescribed" rows="2"></textarea></div>
            <div class="form-row mb-8">
              <div class="field"><label>Pain Score Before (0-10)</label><input name="pain_score_before" type="number" min="0" max="10"></div>
              <div class="field"><label>Pain Score After (0-10)</label><input name="pain_score_after" type="number" min="0" max="10"></div>
            </div>
            <div class="modal-actions"><button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
          </form>`);
        document.getElementById("cancelBtn").addEventListener("click", closeModal);
        document.getElementById("sessionForm").addEventListener("submit", async e => {
          e.preventDefault();
          const payload = Object.fromEntries(new FormData(e.target).entries());
          payload.patient_id = id; payload.created_by = state.staff.id;
          payload.treatment_protocol_id = Number(payload.treatment_protocol_id);
          if (payload.pain_score_before === "") delete payload.pain_score_before; else payload.pain_score_before = Number(payload.pain_score_before);
          if (payload.pain_score_after === "") delete payload.pain_score_after; else payload.pain_score_after = Number(payload.pain_score_after);
          const { error } = await sb.from("treatment_session_notes").insert(payload);
          if (error) return toast(error.message, "error");
          // Auto-increment sessions_completed on the linked protocol
          const proto = (protocols.data||[]).find(p => p.id === payload.treatment_protocol_id);
          if (proto) await sb.from("treatment_protocols").update({ sessions_completed: (proto.sessions_completed||0) + 1, updated_at: new Date().toISOString() }).eq("id", proto.id);
          closeModal(); toast("Session note saved.", "success"); renderTab("Clinical");
        });
      }
      const addSessionBtn = document.getElementById("addSessionBtn");
      if (addSessionBtn) addSessionBtn.addEventListener("click", () => openSessionNoteForm(protocols.data[0]?.id));
      body.querySelectorAll("[data-add-session]").forEach(btn => btn.addEventListener("click", () => openSessionNoteForm(btn.dataset.addSession)));
    } else if (tab === "Appointments") {
      const { data } = await sb.from("appointments").select("*, doctor:doctors(name)").eq("patient_id", id).order("slot_time",{ascending:false});
      body.innerHTML = `
        <div class="panel">
          <table><thead><tr><th>When</th><th>Doctor</th><th>Status</th><th>Calendar</th></tr></thead>
          <tbody>${(data||[]).map(a=>`<tr>
            <td>${fmtDate(a.slot_time)}</td><td>${escapeHtml(a.doctor?.name||'—')}</td><td>${statusBadge(a.status)}</td>
            <td>${a.google_event_id ? '<span class="badge green">Synced</span>' : '<span class="badge grey">Pending</span>'}</td>
          </tr>`).join("")||`<tr><td colspan="4" class="empty-state">No appointments yet.</td></tr>`}</tbody></table>
        </div>`;
    } else if (tab === "Billing") {
      const { data } = await sb.from("invoices").select("*, payments(*)").eq("patient_id", id).order("created_at",{ascending:false});
      body.innerHTML = `
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Invoices</div>
            ${can("admin","billing","reception") ? `<button class="btn btn-primary btn-sm" id="addInvoiceBtn">+ New Invoice</button>` : ``}
          </div>
          <table><thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Status</th><th></th></tr></thead>
          <tbody>${(data||[]).map(inv=>`<tr>
            <td>${fmtDateOnly(inv.created_at)}</td><td>${escapeHtml(inv.description||'—')}</td><td>${fmtMoney(inv.amount)}</td>
            <td><span class="badge ${inv.status==='paid'?'green':inv.status==='partial'?'yellow':'red'}">${escapeHtml(inv.status)}</span></td>
            <td>${can("admin","billing") && inv.status!=='paid' ? `<button class="btn btn-secondary btn-sm" data-pay="${inv.id}" data-amount="${inv.amount}">Record Payment</button>` : ``}</td>
          </tr>`).join("")||`<tr><td colspan="5" class="empty-state">No invoices yet.</td></tr>`}</tbody></table>
        </div>`;
      const addInvBtn = document.getElementById("addInvoiceBtn");
      if (addInvBtn) addInvBtn.addEventListener("click", () => openInvoiceForm(id, () => renderTab("Billing")));
      body.querySelectorAll("[data-pay]").forEach(btn => {
        btn.addEventListener("click", () => openPaymentForm(btn.dataset.pay, id, Number(btn.dataset.amount), () => renderTab("Billing")));
      });
    }
  }
  document.querySelectorAll("#patientTabs .tab").forEach(t => t.addEventListener("click", () => renderTab(t.dataset.tab)));
  await renderTab(activeTab);
};

VIEWS.appointments = async function(content) {
  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div class="flex gap-8">
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="confirmed">Confirmed</option>
            <option value="pending_doctor_approval">Pending Doctor Approval</option>
            <option value="pending_confirmation">Pending Confirmation (Overlap)</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
            <option value="missed">Missed</option>
            <option value="declined">Declined</option>
          </select>
        </div>
        ${can("admin","doctor","reception") ? `<button class="btn btn-primary btn-sm" id="addApptBtn">+ New Appointment</button>` : ``}
      </div>
      <table><thead><tr><th>When</th><th>Patient</th><th>Doctor</th><th>Service</th><th>Status</th><th>Calendar</th><th></th></tr></thead>
      <tbody id="apptTbody"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody></table>
    </div>`;

  async function load(status) {
    let q = sb.from("appointments").select("*, patient:patients(name,phone), doctor:doctors(name), service:services(name)").order("slot_time",{ascending:false}).limit(200);
    if (status) q = q.eq("status", status);
    const { data, error } = await q;
    const tbody = document.getElementById("apptTbody");
    if (error) { tbody.innerHTML = `<tr><td colspan="7">Error: ${escapeHtml(error.message)}</td></tr>`; return; }
    tbody.innerHTML = (data||[]).map(a => `
      <tr>
        <td>${fmtDate(a.slot_time)}</td>
        <td>${escapeHtml(a.patient?.name||'—')}<div class="muted" style="font-size:11px">${escapeHtml(a.patient?.phone||'')}</div></td>
        <td>${escapeHtml(a.doctor?.name||'—')}</td>
        <td>${escapeHtml(a.service?.name||'—')}</td>
        <td>${statusBadge(a.status)}</td>
        <td>${a.google_event_id ? '<span class="badge green">Synced</span>' : '<span class="badge grey">Pending</span>'}</td>
        <td>${can("admin","doctor","reception") ? `<select data-id="${a.id}" class="statusSelect">
            ${["confirmed","completed","cancelled","missed"].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${s}</option>`).join("")}
          </select>` : ``}</td>
      </tr>`).join("") || `<tr><td colspan="7" class="empty-state">No appointments found.</td></tr>`;
    tbody.querySelectorAll(".statusSelect").forEach(sel => {
      sel.addEventListener("change", async () => {
        const payload = { status: sel.value };
        if (sel.value === "completed") payload.completed_at = new Date().toISOString();
        const { error } = await sb.from("appointments").update(payload).eq("id", sel.dataset.id);
        if (error) toast(error.message, "error"); else toast("Status updated.", "success");
      });
    });
  }
  await load("");
  document.getElementById("statusFilter").addEventListener("change", e => load(e.target.value));
  const addBtn = document.getElementById("addApptBtn");
  if (addBtn) addBtn.addEventListener("click", () => openAppointmentForm(() => load(document.getElementById("statusFilter").value)));
};

async function openAppointmentForm(onSaved) {
  const [{ data: patients }, { data: doctors }, { data: services }] = await Promise.all([
    sb.from("patients").select("id,name,phone").order("name"),
    sb.from("doctors").select("id,name").eq("is_active", true).order("name"),
    sb.from("services").select("id,name,specialty").eq("is_active", true).order("specialty").order("name"),
  ]);
  openModal("New Appointment", `
    <form id="apptForm">
      <div class="field mb-8"><label>Patient *</label>
        <select name="patient_id" required>${(patients||[]).map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${escapeHtml(p.phone||'')}</option>`).join("")}</select>
      </div>
      <div class="field mb-8"><label>Doctor</label>
        <select name="doctor_id"><option value="">—</option>${(doctors||[]).map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("")}</select>
      </div>
      <div class="field mb-8"><label>Service</label>
        <select name="service_id"><option value="">—</option>${(services||[]).map(s=>`<option value="${s.id}">${escapeHtml(s.specialty)} — ${escapeHtml(s.name)}</option>`).join("")}</select>
      </div>
      <div class="field mb-8"><label>Date &amp; Time *</label><input name="slot_time" type="datetime-local" required></div>
      <div class="modal-actions"><button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button><button type="submit" class="btn btn-primary">Book</button></div>
    </form>`);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  document.getElementById("apptForm").addEventListener("submit", async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.slot_time = new Date(payload.slot_time).toISOString();
    payload.status = "confirmed"; payload.source = "dashboard";
    if (!payload.doctor_id) delete payload.doctor_id;
    if (!payload.service_id) delete payload.service_id;
    if (payload.doctor_id) {
      const { data: clash } = await sb.from("appointments").select("id")
        .eq("doctor_id", payload.doctor_id).eq("slot_time", payload.slot_time).eq("status", "confirmed");
      if (clash && clash.length) {
        if (!confirm("This doctor already has a CONFIRMED appointment at this exact time. Book anyway as a double-booking?")) return;
      }
    }
    const { error } = await sb.from("appointments").insert(payload);
    if (error) return toast(error.message, "error");
    closeModal(); toast("Appointment booked.", "success"); onSaved && onSaved();
  });
}

/* ======================================================================
   CLOSURES & HOLIDAYS (admin/doctor manage, reception views)
   A closure blocks confirmed bookings on those days for every path (DB
   trigger), shows up as busy to the WhatsApp bot, and puts a notice on the
   website. Existing bookings are NOT cancelled automatically - staff are
   shown who to contact.
   ====================================================================== */
function addDaysISO(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function fmtClosureRange(c) {
  const f = s => new Date(s + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  return c.start_date === c.end_date ? f(c.start_date) : `${f(c.start_date)} → ${f(c.end_date)}`;
}
async function bookingsDuringClosure(c) {
  let q = sb.from("appointments")
    .select("id, slot_time, status, patient:patients(name, phone), doctor:doctors(name)")
    .gte("slot_time", `${c.start_date}T00:00:00+05:30`)
    .lt("slot_time", `${addDaysISO(c.end_date, 1)}T00:00:00+05:30`)
    .in("status", ["confirmed","pending_doctor_approval","pending_confirmation","reschedule_pending"])
    .order("slot_time");
  if (c.doctor_id) q = q.eq("doctor_id", c.doctor_id);
  const { data } = await q;
  return data || [];
}

VIEWS.closures = async function(content) {
  const today = todayIST();
  const [{ data: closures, error }, { data: doctors }] = await Promise.all([
    sb.from("clinic_closures").select("*").order("start_date", { ascending: true }),
    sb.from("doctors").select("id, name").eq("is_active", true).order("name"),
  ]);
  if (error) throw error;
  const docName = id => (doctors || []).find(d => d.id === id)?.name || "Doctor";
  const upcoming = (closures || []).filter(c => c.end_date >= today);
  const past = (closures || []).filter(c => c.end_date < today).reverse().slice(0, 10);
  const canEdit = can("admin", "doctor");
  const affected = await Promise.all(upcoming.map(bookingsDuringClosure));

  const row = (c, i, isPast) => `<tr>
    <td>${fmtClosureRange(c)}${!isPast && c.start_date <= today ? ` <span class="badge red">Closed now</span>` : ``}</td>
    <td>${c.doctor_id ? escapeHtml(docName(c.doctor_id)) : `<strong>Whole clinic</strong>`}</td>
    <td>${escapeHtml(c.note)}</td>
    ${isPast ? `` : `<td>${affected[i].length ? `<button class="btn btn-secondary btn-sm" data-affected="${i}">⚠ ${affected[i].length} booked</button>` : `<span class="muted">None</span>`}</td>`}
    <td>${canEdit ? `<button class="btn btn-danger btn-sm" data-remove="${c.id}">Remove</button>` : ``}</td>
  </tr>`;

/* ======================================================================
   WEBSITE ARTICLES (admin, doctor, marketing)
   Doctor/marketing write and submit; only an admin can approve (enforced in
   the database, not just here). Approved articles go live on the next free
   Tue/Fri 10:00 AM IST slot, or a date the admin picks.
   ====================================================================== */
const ARTICLE_TYPES = { article: "Article", news: "News", workshop: "Workshop", event: "Event" };
const WEBSITE_URL = "https://www.shivwikholisticcare.com";

function articleState(a) {
  if (a.status === "approved") return a.publish_at && new Date(a.publish_at) <= new Date() ? "live" : "scheduled";
  return a.status;
}
function articleStatusBadge(a) {
  const map = {
    live: ["green","Live"], scheduled: ["purple","Scheduled"], pending_review: ["yellow","Awaiting approval"],
    draft: ["grey","Draft"], rejected: ["red","Changes requested"], archived: ["grey","Unpublished"],
  };
  const [c, l] = map[articleState(a)] || ["grey", a.status];
  return `<span class="badge ${c}">${l}</span>`;
}
function slugify(t) {
  const s = String(t || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70).replace(/-+$/, "");
  return s || ("article-" + Date.now().toString(36));
}
function toLocalInput(d) {
  if (!d) return "";
  const dt = new Date(d);
  return new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
// Same minimal format as the website renderer: "## Heading", "- bullet",
// **bold**, blank line = new paragraph. No raw HTML or links, by design.
function renderArticleBody(md) {
  const inline = s => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const out = []; let para = [], list = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list.length) { out.push("<ul>" + list.map(l => "<li>" + inline(l) + "</li>").join("") + "</ul>"); list = []; } };
  for (const raw of String(md || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trim();
    let m;
    if (!line) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^#{1,3}\s+(.*)$/))) { flushPara(); flushList(); out.push("<h2>" + inline(m[1]) + "</h2>"); continue; }
    if ((m = line.match(/^[-*•]\s+(.*)$/))) { flushPara(); list.push(m[1]); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join("");
}

        <div class="format-help">Formatting: blank line = new paragraph &middot; <code>## Heading</code> &middot; <code>- bullet point</code> &middot; <code>**bold**</code>. The general-information disclaimer is added automatically.</div></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="button" class="btn btn-secondary" id="previewBtn">Preview</button>
        ${isApproved
          ? `<button type="submit" class="btn btn-primary" data-action="keep">Save Changes</button>`
          : `<button type="submit" class="btn btn-secondary" data-action="draft">Save Draft</button>
             ${isAdmin ? `<button type="submit" class="btn btn-primary" data-action="approve">Save &amp; Approve</button>`
                       : `<button type="submit" class="btn btn-primary" data-action="pending_review">Submit for Approval</button>`}`}
      </div>
    </form>`, { wide: true, persistent: true });

  const form = document.getElementById("articleForm");
  const field = n => form.querySelector(`[name="${n}"]`);
  const slugInput = field("slug");
  let slugTouched = !!a?.slug;
  slugInput.addEventListener("input", () => { slugTouched = true; });
  field("title").addEventListener("input", () => { if (!slugTouched) slugInput.value = slugify(field("title").value); });
  const syncEventField = () => document.getElementById("eventDateField").classList.toggle("hidden", !["workshop","event"].includes(field("type").value));
  field("type").addEventListener("change", syncEventField); syncEventField();

  const collect = () => {
    const fd = new FormData(form);
    const type = fd.get("type");
    return {
      title: fd.get("title").trim(), slug: (fd.get("slug") || slugify(fd.get("title"))).trim(), type,
      summary: fd.get("summary").trim(), body: fd.get("body"),
      event_date: ["workshop","event"].includes(type) && fd.get("event_date") ? new Date(fd.get("event_date")).toISOString() : null,
    };
  };
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  document.getElementById("previewBtn").addEventListener("click", () => {
    const draft = collect();
    const w = window.open("", "_blank");
    if (!w) return toast("Allow pop-ups to preview.", "error");
    w.document.write(`<!doctype html><title>Preview</title><body style="font-family:Inter,system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;line-height:1.65;color:#163331">
      <h1>${escapeHtml(draft.title)}</h1><p style="color:#4b6563">${escapeHtml(draft.summary)}</p>${renderArticleBody(draft.body)}</body>`);

  let clickedAction = null;
  form.querySelectorAll("[data-action]").forEach(b => b.addEventListener("click", () => { clickedAction = b.dataset.action; }));
  form.addEventListener("submit", async e => {
    e.preventDefault();

    const payload = collect();
    if (action === "draft" || action === "pending_review") payload.status = action;
    if (action === "approve") payload.status = "pending_review";
    if (!isEdit) payload.author_name = state.staff.name;
    const res = isEdit
      ? await sb.from("articles").update(payload).eq("id", a.id).select().single()
      : await sb.from("articles").insert(payload).select().single();
    if (res.error) {
      return toast(res.error.code === "23505" ? "Another article already uses this web address - change it." : res.error.message, "error");

    closeModal();
    if (action === "approve") return openApproveArticle(res.data, nextSlot, () => navigate("articles", { filter: "scheduled" }));
    toast(action === "pending_review" ? "Submitted for approval." : "Saved.", "success");
    navigate("articles", { filter: action === "keep" ? "all" : action });
  });
}

async function callAdminFn(action, payload) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(EDGE_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + session.access_token,
      "apikey": SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ action, ...payload }),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || "Request failed.");
  return json;
}

        <td>
          <select data-role="${s.id}" ${s.id===state.staff.id?'disabled':''}>
            ${STAFF_ROLES.map(r=>`<option value="${r}" ${s.role===r?'selected':''}>${ROLE_LABELS[r]}</option>`).join("")}
          </select>
        </td>
        <td><span class="badge ${s.active?'green':'red'}">${s.active?'Active':'Inactive'}</span></td>
        <td class="flex gap-8">
          ${s.id!==state.staff.id ? `<button class="btn btn-secondary btn-sm" data-toggle="${s.id}" data-active="${s.active}">${s.active?'Deactivate':'Activate'}</button>
          <button class="btn btn-danger btn-sm" data-delete="${s.id}">Delete</button>` : `<span class="muted">You</span>`}
        </td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty-state">No staff yet.</td></tr>`;

    tbody.querySelectorAll("[data-role]").forEach(sel => sel.addEventListener("change", async () => {
      try { await callAdminFn("update_role", { id: sel.dataset.role, role: sel.value }); toast("Role updated.", "success"); }
      catch (err) { toast(err.message, "error"); load(); }
    }));
    tbody.querySelectorAll("[data-toggle]").forEach(btn => btn.addEventListener("click", async () => {
      try { await callAdminFn("set_active", { id: btn.dataset.toggle, active: btn.dataset.active !== "true" }); toast("Updated.", "success"); load(); }
      catch (err) { toast(err.message, "error"); }
    }));
    tbody.querySelectorAll("[data-delete]").forEach(btn => btn.addEventListener("click", async () => {
      if (!confirm("Permanently delete this staff login? This cannot be undone.")) return;
      try { await callAdminFn("delete", { id: btn.dataset.delete }); toast("Deleted.", "success"); load(); }
      catch (err) { toast(err.message, "error"); }
    }));
  }
  await load();
  document.getElementById("addStaffBtn").addEventListener("click", () => {
    openModal("Add Staff Member", `
      <form id="staffForm">
        <div class="field mb-8"><label>Name *</label><input name="name" required></div>
        <div class="field mb-8"><label>Email *</label><input name="email" type="email" required></div>
        <div class="field mb-8"><label>Temporary Password * (min 8 characters)</label><input name="password" type="text" required minlength="8"></div>
        <div class="field mb-8"><label>Role *</label>
          <select name="role" required>${STAFF_ROLES.map(r=>`<option value="${r}">${ROLE_LABELS[r]}</option>`).join("")}</select>
          <div class="format-help">Marketing can only write website articles &mdash; no access to patients, appointments or billing.</div>
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button><button type="submit" class="btn btn-primary">Create Login</button></div>
      </form>`);
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("staffForm").addEventListener("submit", async e => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(e.target).entries());
      try {
        await callAdminFn("create", payload);
        closeModal(); toast("Staff account created.", "success"); load();
      } catch (err) { toast(err.message, "error"); }
    });
  });
};

/* ======================================================================
   IMPORT / EXPORT / BACKUP (admin only)
   ====================================================================== */
const BACKUP_TABLES = ["patients","doctors","services","appointments","medical_history","treatment_protocols",
  "treatment_session_notes","invoices","payments","feedback","reports","escalations","call_logs","error_log","staff",
  "articles","clinic_closures","calendar_busy_blocks","website_booking_requests"];

VIEWS.data = async function(content) {
  content.innerHTML = `
    <div class="panel">
      <div class="panel-title mb-16">Bulk Import — Patients</div>
      <p class="muted mb-8">CSV columns: name, phone, email, dob, gender, address, emergency_contact_name, emergency_contact_phone, notes. Existing patients are matched and updated by phone number.</p>
      <input type="file" id="importFile" accept=".csv">
      <button class="btn btn-primary btn-sm" id="importBtn" style="margin-left:10px">Import CSV</button>
      <button class="btn btn-secondary btn-sm" id="templateBtn">Download Template</button>
      <div id="importResult" class="mb-8" style="margin-top:12px"></div>
    </div>
    <div class="panel">
      <div class="panel-title mb-16">Export a Table</div>
      <div class="flex gap-8">
        <select id="exportTable">${BACKUP_TABLES.map(t=>`<option value="${t}">${t}</option>`).join("")}</select>
        <button class="btn btn-secondary btn-sm" id="exportCsvBtn">Export as CSV</button>
        <button class="btn btn-secondary btn-sm" id="exportJsonBtn">Export as JSON</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title mb-16">Full Backup</div>
      <p class="muted mb-8">Downloads every table as one JSON file — keep this somewhere safe (e.g. cloud drive) as a periodic backup.</p>
      <button class="btn btn-primary btn-sm" id="fullBackupBtn">Download Full Backup</button>
    </div>
    <div class="panel">
      <div class="panel-title mb-16">Restore From Backup</div>
      <p class="muted mb-8" style="color:var(--yellow)">⚠️ This upserts rows by id from a previously downloaded backup file. It does not delete anything, but can overwrite existing rows with the backup's data. Use with care.</p>
      <input type="file" id="restoreFile" accept=".json">
      <button class="btn btn-danger btn-sm" id="restoreBtn" style="margin-left:10px">Restore From File</button>
    </div>`;

  document.getElementById("templateBtn").addEventListener("click", () => {
    downloadFile("patients_import_template.csv",
      "name,phone,email,dob,gender,address,emergency_contact_name,emergency_contact_phone,notes\n" +
      "Jane Doe,919999999999,jane@example.com,1990-01-01,female,\"123 MG Road, City\",John Doe,918888888888,Left knee pain\n",
      "text/csv");
  });

  document.getElementById("importBtn").addEventListener("click", async () => {
    const file = document.getElementById("importFile").files[0];
    const resultEl = document.getElementById("importResult");
    if (!file) { resultEl.innerHTML = `<span style="color:var(--red)">Choose a CSV file first.</span>`; return; }
    const text = await file.text();
    const rows = parseCSV(text);
    if (!rows.length) { resultEl.innerHTML = `<span style="color:var(--red)">No rows found in file.</span>`; return; }
    let ok = 0, fail = 0;
    for (const row of rows) {
      if (!row.phone) { fail++; continue; }
      const payload = { ...row, updated_at: new Date().toISOString() };
      const { error } = await sb.from("patients").upsert(payload, { onConflict: "phone" });
      if (error) fail++; else ok++;
    }
    resultEl.innerHTML = `Imported ${ok} row(s)${fail?`, ${fail} failed (check phone numbers / required fields)`:''}.`;
    toast(`Import complete: ${ok} saved.`, fail ? "error" : "success");
  });

  document.getElementById("exportCsvBtn").addEventListener("click", async () => {
    const table = document.getElementById("exportTable").value;
    const { data, error } = await sb.from(table).select("*");
    if (error) return toast(error.message, "error");
    downloadFile(`${table}_export.csv`, toCSV(data||[]), "text/csv");
  });
  document.getElementById("exportJsonBtn").addEventListener("click", async () => {
    const table = document.getElementById("exportTable").value;
    const { data, error } = await sb.from(table).select("*");
    if (error) return toast(error.message, "error");
    downloadFile(`${table}_export.json`, JSON.stringify(data||[], null, 2), "application/json");
  });

  document.getElementById("fullBackupBtn").addEventListener("click", async () => {
    toast("Building backup… this may take a moment.");
    const backup = { created_at: new Date().toISOString(), tables: {} };
    for (const t of BACKUP_TABLES) {
      const { data, error } = await sb.from(t).select("*");
      backup.tables[t] = error ? { error: error.message } : data;
    }
    downloadFile(`shc_backup_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`, JSON.stringify(backup, null, 2), "application/json");
    toast("Backup downloaded.", "success");
  });

  document.getElementById("restoreBtn").addEventListener("click", async () => {
    const file = document.getElementById("restoreFile").files[0];
    if (!file) return toast("Choose a backup JSON file first.", "error");
    if (!confirm("This will upsert data from the backup file into your live database. Continue?")) return;
    const text = await file.text();
    let backup;
    try { backup = JSON.parse(text); } catch { return toast("Invalid JSON file.", "error"); }
    const tables = backup.tables || backup;
    let ok = 0, fail = 0;
    for (const t of BACKUP_TABLES) {
      const rows = tables[t];
      if (!Array.isArray(rows) || !rows.length) continue;
      const { error } = await sb.from(t).upsert(rows, { onConflict: "id" });
      if (error) { fail++; toast(`${t}: ${error.message}`, "error"); } else ok++;
    }
    toast(`Restore finished. ${ok} table(s) restored${fail?`, ${fail} had errors`:''}.`, fail ? "error" : "success");
  });
};

document.getElementById("signOutBtn").addEventListener("click", () => handleSignOut());
document.getElementById("topSignOutBtn").addEventListener("click", () => handleSignOut());
document.getElementById("changePasswordBtn").addEventListener("click", openChangePasswordModal);
bootstrapSession();
</script>
